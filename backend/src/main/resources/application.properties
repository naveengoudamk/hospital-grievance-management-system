spring.application.name=hospital-grievance-backend
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/

# File Upload Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Application specific properties
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend.public-url=${PUBLIC_FRONTEND_URL:http://localhost:5173/public}
app.frontend.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
app.upload.dir=${FILE_UPLOAD_DIR:./uploads}

# Default Admin Setup
app.initial-admin.username=${ADMIN_USERNAME:admin}
app.initial-admin.password=${ADMIN_PASSWORD:Admin@12345}
app.initial-admin.email=${ADMIN_EMAIL:admin@hospital.org}
app.initial-admin.full-name=${ADMIN_FULL_NAME:Chief Grievance Administrator}

# Default Demo Committee Members Setup
app.seed-demo-users=${SEED_DEMO_USERS:true}
